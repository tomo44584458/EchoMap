<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoMap | 世界の音を旅する地図</title>

    <!-- GitHub Pagesでそのまま動かせるように、CSS/JSはCDNから読み込みます。 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!--
      Leaflet CSS
      integrity属性の値がCDN側の実体とズレるとブラウザにブロックされるため、
      今回は integrity / crossorigin を外しています。
    -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!--
      Leaflet JS
      CSS側と同じく、CDN読み込み時のintegrity不一致を避けるため、
      integrity / crossorigin を外しています。
    -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

    <style>
      html,
      body {
        height: 100%;
      }

      #map {
        height: 100vh;
        left: 0;
        position: absolute;
        top: 0;
        width: 100vw;
        z-index: 0;
      }

      .control-panel {
        z-index: 10;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #020617;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      /*
        Tailwindやブラウザ側のCSSリセットで img { max-width: 100%; } が効くと、
        Leafletの地図タイル画像のサイズ計算が崩れることがあります。
        タイル歯抜け・ズレ対策として、Leaflet内の画像は本来サイズで表示させます。
      */
      .leaflet-container img {
        max-width: none;
      }

      .leaflet-tile {
        max-width: none !important;
      }

      /* Leafletのポップアップもアプリ全体のダークな雰囲気に合わせます。 */
      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        background: rgba(15, 23, 42, 0.95);
        color: #e2e8f0;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      }

      .leaflet-popup-content {
        margin: 14px 16px;
      }

      /* ピンを少し光らせ、夜の地図上でも見つけやすくします。 */
      .pulse-pin {
        align-items: center;
        background: linear-gradient(135deg, #22d3ee, #a78bfa);
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 9999px;
        box-shadow: 0 0 0 8px rgba(34, 211, 238, 0.12), 0 12px 30px rgba(14, 165, 233, 0.35);
        color: #0f172a;
        display: flex;
        font-size: 15px;
        height: 34px;
        justify-content: center;
        position: relative;
        width: 34px;
      }

      /* 再生中のピンだけ、水色の円が外へ広がる波紋エフェクトを重ねます。 */
      .sound-marker.is-playing .pulse-pin::before,
      .sound-marker.is-playing .pulse-pin::after {
        animation: playing-ripple 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) infinite;
        border: 2px solid rgba(0, 229, 255, 0.72);
        border-radius: 9999px;
        box-shadow: 0 0 24px rgba(0, 229, 255, 0.45);
        content: "";
        inset: -8px;
        opacity: 0;
        pointer-events: none;
        position: absolute;
      }

      .sound-marker.is-playing .pulse-pin::after {
        animation-delay: 0.9s;
      }

      @keyframes playing-ripple {
        0% {
          opacity: 0.75;
          transform: scale(0.65);
        }

        70%,
        100% {
          opacity: 0;
          transform: scale(2.25);
        }
      }

      input[type="range"] {
        accent-color: #22d3ee;
      }

      .now-playing-card {
        overflow: hidden;
        position: relative;
      }

      .now-playing-card::after {
        background: radial-gradient(circle at 78% 52%, rgba(0, 229, 255, 0.18), transparent 62%);
        content: "";
        height: 160px;
        opacity: 0;
        pointer-events: none;
        position: absolute;
        right: -42px;
        top: 50%;
        transform: translateY(-50%);
        transition: opacity 0.35s ease;
        width: 180px;
      }

      .now-playing-card.has-visualizer::after {
        opacity: 1;
      }

      .now-playing-content {
        position: relative;
        z-index: 1;
      }

      .audio-visualizer {
        align-items: flex-end;
        align-self: stretch;
        display: flex;
        flex-shrink: 0;
        gap: 2px;
        height: 82px;
        justify-content: flex-end;
        min-width: 116px;
        opacity: 0.5;
        overflow: hidden;
        padding: 9px 1px 0;
        position: relative;
        transition: opacity 0.35s ease, filter 0.35s ease;
        width: 132px;
      }

      .audio-visualizer::before {
        background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.5), transparent);
        bottom: 0;
        content: "";
        height: 1px;
        left: 0;
        opacity: 0.55;
        position: absolute;
        right: 0;
      }

      .audio-visualizer.is-active {
        filter: drop-shadow(0 0 13px rgba(0, 229, 255, 0.68));
        opacity: 1;
      }

      .visualizer-bar {
        --level: 0.12;
        background: linear-gradient(180deg, rgba(255, 79, 216, 0.92), #00e5ff 52%, rgba(0, 229, 255, 0.72));
        border-radius: 9999px 9999px 2px 2px;
        box-shadow: 0 0 8px rgba(0, 229, 255, 0.7), 0 0 18px rgba(255, 79, 216, 0.18);
        flex: 1 1 0;
        height: calc(6px + (var(--level) * 68px));
        max-width: 3px;
        min-height: 6px;
        opacity: 0.72;
        transform-origin: bottom center;
        transition: height 70ms linear, opacity 0.25s ease;
      }

      .audio-visualizer.is-active .visualizer-bar {
        opacity: 0.95;
      }

      .audio-visualizer:not(.is-active) .visualizer-bar {
        opacity: 0.36;
      }

      @media (max-width: 420px) {
        .audio-visualizer {
          gap: 1.5px;
          min-width: 92px;
          width: 104px;
        }
      }
    </style>
  </head>
  <body>
    <main class="relative h-full w-full">
      <div id="map" aria-label="世界中のライブ音源を選べる地図"></div>

      <!-- 半透明のコントロールパネル。スマホでは下部、PCでは左上に固定します。 -->
      <section
        class="control-panel absolute inset-x-4 bottom-4 rounded-3xl border border-white/15 bg-slate-950/75 p-5 text-white shadow-2xl shadow-cyan-950/40 backdrop-blur-xl md:bottom-auto md:left-6 md:right-auto md:top-6 md:w-[380px]"
        aria-label="再生コントロール"
      >
        <div class="mb-5 flex items-start justify-between gap-4">
          <div>
            <p class="text-xs font-semibold uppercase tracking-[0.35em] text-cyan-300">EchoMap</p>
            <h1 class="mt-1 text-2xl font-bold tracking-tight">世界の音へジャンプ</h1>
          </div>
          <span id="statusBadge" class="rounded-full bg-slate-800 px-3 py-1 text-xs font-semibold text-slate-300">
            Standby
          </span>
        </div>

        <div id="nowPlayingCard" class="now-playing-card rounded-2xl border border-white/10 bg-white/10 p-4">
          <div class="now-playing-content flex items-center justify-between gap-4">
            <div class="min-w-0">
              <p class="text-sm text-slate-300">現在再生中</p>
              <h2 id="cityName" class="mt-1 truncate text-3xl font-black leading-tight">都市を選択</h2>
              <p id="stationName" class="mt-1 truncate text-sm font-medium text-cyan-200">
                地図上のピンをクリックしてください
              </p>
            </div>
            <div id="audioVisualizer" class="audio-visualizer" aria-hidden="true"></div>
          </div>
        </div>

        <div class="mt-5 grid grid-cols-2 gap-3">
          <button
            id="toggleButton"
            type="button"
            class="rounded-2xl bg-cyan-400 px-4 py-3 font-bold text-slate-950 transition hover:bg-cyan-300 focus:outline-none focus:ring-4 focus:ring-cyan-300/35 disabled:cursor-not-allowed disabled:opacity-50"
            disabled
          >
            ▶ Play
          </button>
          <button
            id="randomButton"
            type="button"
            class="rounded-2xl border border-white/15 bg-white/10 px-4 py-3 font-bold transition hover:bg-white/20 focus:outline-none focus:ring-4 focus:ring-white/20"
          >
            Random Jump
          </button>
        </div>

        <label class="mt-5 block text-sm font-semibold text-slate-200" for="volumeSlider">
          音量 <span id="volumeValue" class="text-cyan-200">70%</span>
        </label>
        <input id="volumeSlider" class="mt-2 w-full" type="range" min="0" max="100" value="70" />

        <p id="message" class="mt-4 min-h-5 text-xs leading-relaxed text-slate-300">
          ライブ配信は各放送局が提供するため、地域や時間帯によって再生できない場合があります。
        </p>
      </section>
    </main>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        // Leaflet本体がCDNから読み込めなかった場合の保険です。
        if (typeof L === "undefined") {
          console.error("Leafletが読み込めていません。CDNの読み込み状況を確認してください。");
          return;
        }

        // 都市データはここにまとめています。新しい音源を足すときは、この配列に1件追加するだけです。
        const audioSpots = [
          {
            city: "東京",
            country: "Japan",
            station: "J1 HITS",
            coordinates: [35.6762, 139.6503],
            streamUrl: "https://jenny.torontocast.com:2000/stream/J1HITS",
            sourceUrl: "https://www.j1fm.tokyo/j1/developers/",
          },
          {
            city: "ニューヨーク",
            country: "United States",
            station: "WNYC FM 93.9",
            coordinates: [40.7128, -74.006],
            streamUrl: "https://fm939.wnyc.org/wnycfm",
            sourceUrl: "https://www.wnyc.org/radio/",
          },
          {
            city: "ロンドン",
            country: "United Kingdom",
            station: "NTS Radio 1",
            coordinates: [51.5074, -0.1278],
            streamUrl: "https://stream-relay-geo.ntslive.net/stream",
            sourceUrl: "https://www.nts.live/radio",
          },
          {
            city: "パリ",
            country: "France",
            station: "FIP Radio",
            coordinates: [48.8566, 2.3522],
            streamUrl: "https://icecast.radiofrance.fr/fip-hifi.aac",
            sourceUrl: "https://www.radiofrance.fr/fip",
          },
          {
            city: "リオデジャネイロ",
            country: "Brazil",
            station: "JB FM Rio",
            coordinates: [-22.9068, -43.1729],
            streamUrl: "https://playerservices.streamtheworld.com/api/livestream-redirect/JBFMAAC.aac",
            sourceUrl: "https://www.jbfm.com.br/",
          },
          {
            city: "サンフランシスコ",
            country: "United States",
            station: "SomaFM Live",
            coordinates: [37.7749, -122.4194],
            streamUrl: "https://ice5.somafm.com/live-128-mp3",
            sourceUrl: "https://somafm.com/live/directstreamlinks.html",
          },
        ];

        const mapElement = document.querySelector("#map");
        const worldBounds = L.latLngBounds([
          [-85.05112878, -180],
          [85.05112878, 180],
        ]);

        function calculateSingleWorldZoom() {
          // Webメルカトル地図は「256px × 2^zoom」の正方形です。画面より世界地図が
          // 小さいzoomを許すと、Leafletが右隣に世界のコピーを描き、つなぎ目が不自然に
          // 見えます。画面を覆える最小の整数zoomを下限にして、世界のコピーを出しません。
          const width = mapElement?.clientWidth || window.innerWidth;
          const height = mapElement?.clientHeight || window.innerHeight;
          const longestSide = Math.max(width, height);

          return Math.max(2, Math.ceil(Math.log2(longestSide / 256)));
        }

        const initialZoom = calculateSingleWorldZoom();
        const map = L.map("map", {
          zoomControl: false,
          maxBounds: worldBounds,
          maxBoundsViscosity: 1,
          minZoom: initialZoom,
          zoomSnap: 1,
          zoomDelta: 1,
        }).setView([25, 10], initialZoom);

        L.control.zoom({ position: "bottomright" }).addTo(map);

        // CartoDB.DarkMatterタイルで、画面いっぱいのダークモード地図を表示します。
        const baseTiles = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
          bounds: worldBounds,
          keepBuffer: 6,
          maxZoom: 19,
          noWrap: true,
          updateWhenIdle: false,
          updateWhenZooming: false,
        }).addTo(map);

        const tileRetryCounts = new WeakMap();
        baseTiles.on("tileerror", (event) => {
          const retryCount = tileRetryCounts.get(event.tile) || 0;

          if (retryCount >= 2) return;

          tileRetryCounts.set(event.tile, retryCount + 1);
          window.setTimeout(() => {
            const retryUrl = new URL(event.tile.src);
            retryUrl.searchParams.set("retry", `${Date.now()}-${retryCount + 1}`);
            event.tile.src = retryUrl.toString();
          }, 350 * (retryCount + 1));
        });

        function applyResponsiveZoomFloor() {
          const nextMinZoom = calculateSingleWorldZoom();
          map.setMinZoom(nextMinZoom);

          if (map.getZoom() < nextMinZoom) {
            map.setZoom(nextMinZoom, { animate: false });
          }
        }

        function refreshMapLayout() {
          // 初期表示時や画面回転時にブラウザがまだレイアウト計算中だと、Leafletが地図
          // コンテナを小さく見積もって一部のタイルだけを読み込むことがあります。実サイズ
          // を再計算し、世界地図1枚で画面を覆えるzoom下限も更新して歯抜けと継ぎ目を防ぎます。
          applyResponsiveZoomFloor();
          map.invalidateSize({ pan: false });
          map.panInsideBounds(worldBounds, { animate: false });
        }

        requestAnimationFrame(refreshMapLayout);
        window.addEventListener("load", refreshMapLayout);
        window.addEventListener("resize", refreshMapLayout);
        setTimeout(refreshMapLayout, 250);
        setTimeout(refreshMapLayout, 750);

        const audio = new Audio();
        audio.preload = "none";
        audio.volume = 0.7;

        const cityName = document.querySelector("#cityName");
        const stationName = document.querySelector("#stationName");
        const statusBadge = document.querySelector("#statusBadge");
        const toggleButton = document.querySelector("#toggleButton");
        const randomButton = document.querySelector("#randomButton");
        const volumeSlider = document.querySelector("#volumeSlider");
        const volumeValue = document.querySelector("#volumeValue");
        const message = document.querySelector("#message");
        const nowPlayingCard = document.querySelector("#nowPlayingCard");
        const audioVisualizer = document.querySelector("#audioVisualizer");
        const fallbackVisualizerShape = [
          0.2, 0.22, 0.23, 0.24, 0.3, 0.44, 0.62, 0.84, 0.96, 1, 0.92, 0.72, 0.42, 0.28,
          0.25, 0.23, 0.2, 0.16, 0.13, 0.18, 0.24, 0.2, 0.15, 0.12, 0.14, 0.2, 0.34, 0.46,
        ];
        const visualizerBars = fallbackVisualizerShape.map((level) => {
          const bar = document.createElement("span");
          bar.className = "visualizer-bar";
          bar.style.setProperty("--level", (0.08 + level * 0.1).toFixed(3));
          audioVisualizer.append(bar);
          return bar;
        });

        let currentSpot = null;
        let lastRandomIndex = -1;
        let audioContext = null;
        let analyser = null;
        let analyserData = null;
        let audioSource = null;
        let visualizerFrameId = null;
        const visualizerLevels = fallbackVisualizerShape.map((level) => 0.08 + level * 0.1);
        const spotMarkers = new Map();

        const pinIcon = L.divIcon({
          className: "sound-marker",
          html: '<div class="pulse-pin">◉</div>',
          iconSize: [34, 34],
          iconAnchor: [17, 17],
          popupAnchor: [0, -18],
        });

        // ピンをクリックしたらselectSpotを呼び、前の音を止めて新しい音を再生します。
        audioSpots.forEach((spot) => {
          const marker = L.marker(spot.coordinates, { icon: pinIcon })
            .addTo(map)
            .bindPopup(
              `<strong>${spot.city}</strong><br><span>${spot.station}</span><br><small>${spot.country}</small><br><a class="text-cyan-200 underline" href="${spot.sourceUrl}" target="_blank" rel="noopener noreferrer">配信元を見る</a>`,
            )
            .on("click", () => selectSpot(spot, true));

          spotMarkers.set(spot, marker);
        });

        function setPlayingMarker(playingSpot) {
          spotMarkers.forEach((marker, spot) => {
            marker.getElement()?.classList.toggle("is-playing", spot === playingSpot);
          });
        }

        function updateStatus(text, styleClass) {
          statusBadge.textContent = text;
          statusBadge.className = `rounded-full px-3 py-1 text-xs font-semibold ${styleClass}`;
        }

        function updateNowPlaying(spot) {
          cityName.textContent = spot.city;
          stationName.textContent = `${spot.station} / ${spot.country}`;
          toggleButton.disabled = false;
        }

        function setupAudioAnalyser() {
          if (analyser) return true;

          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return false;

          try {
            audioContext = audioContext || new AudioContext();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.84;
            analyserData = new Uint8Array(analyser.frequencyBinCount);
            audioSource = audioSource || audioContext.createMediaElementSource(audio);
            audioSource.connect(analyser);
            analyser.connect(audioContext.destination);
            return true;
          } catch (error) {
            console.warn("Audio visualizer setup failed:", error);
            analyser = null;
            analyserData = null;
            return false;
          }
        }

        function setVisualizerActive(isActive) {
          audioVisualizer.classList.toggle("is-active", isActive);
          nowPlayingCard.classList.toggle("has-visualizer", isActive);

          if (!isActive) {
            visualizerBars.forEach((bar, index) => {
              const targetLevel = 0.08 + fallbackVisualizerShape[index] * 0.1;
              visualizerLevels[index] += (targetLevel - visualizerLevels[index]) * 0.16;
              bar.style.setProperty("--level", visualizerLevels[index].toFixed(3));
            });
          }
        }

        function drawVisualizer() {
          if (audio.paused || audio.ended) {
            setVisualizerActive(false);
            visualizerFrameId = null;
            return;
          }

          let hasSignal = false;

          if (analyser && analyserData) {
            analyser.getByteFrequencyData(analyserData);
            const binSize = Math.max(1, Math.floor(analyserData.length / visualizerBars.length));

            visualizerBars.forEach((bar, index) => {
              const start = index * binSize;
              const end = index === visualizerBars.length - 1 ? analyserData.length : start + binSize;
              let sum = 0;

              for (let i = start; i < end; i += 1) {
                sum += analyserData[i];
              }

              const average = sum / Math.max(1, end - start);
              hasSignal = hasSignal || average > 2;
              const normalized = Math.min(1, Math.pow(average / 178, 0.82));
              const targetLevel = 0.07 + normalized * 0.93;
              visualizerLevels[index] += (targetLevel - visualizerLevels[index]) * 0.24;
              bar.style.setProperty("--level", visualizerLevels[index].toFixed(3));
            });
          }

          // 一部のライブ配信はWeb Audio APIへ波形データを渡さないことがあります。
          // その場合でも「再生中」であることが伝わるよう、音量値をベースにした滑らかな動きを出します。
          if (!hasSignal) {
            const time = performance.now() / 310;
            visualizerBars.forEach((bar, index) => {
              const pulse =
                0.78 + Math.sin(time + index * 0.55) * 0.16 + Math.sin(time * 1.7 + index * 0.31) * 0.1;
              const volumeBoost = 0.5 + audio.volume * 0.7;
              const targetLevel = Math.min(1, Math.max(0.06, fallbackVisualizerShape[index] * pulse * volumeBoost));
              visualizerLevels[index] += (targetLevel - visualizerLevels[index]) * 0.18;
              bar.style.setProperty("--level", visualizerLevels[index].toFixed(3));
            });
          }

          setVisualizerActive(true);
          visualizerFrameId = requestAnimationFrame(drawVisualizer);
        }

        function startVisualizer() {
          setVisualizerActive(true);

          if (!visualizerFrameId) {
            visualizerFrameId = requestAnimationFrame(drawVisualizer);
          }
        }

        function stopVisualizer() {
          if (visualizerFrameId) {
            cancelAnimationFrame(visualizerFrameId);
            visualizerFrameId = null;
          }

          setVisualizerActive(false);
        }

        async function selectSpot(spot, shouldAutoPlay) {
          currentSpot = spot;
          updateNowPlaying(spot);
          message.textContent = `${spot.city} のライブ音源に接続しています。`;
          setPlayingMarker(null);

          // srcを差し替える前に必ず停止し、同時に2つの音が鳴らないようにします。
          audio.pause();
          audio.currentTime = 0;
          audio.src = spot.streamUrl;
          audio.load();

          map.flyTo(spot.coordinates, 7, { duration: 1.35 });
          updateStatus("Ready", "bg-cyan-400/20 text-cyan-100");
          toggleButton.textContent = "▶ Play";

          if (shouldAutoPlay) {
            await playCurrentSpot();
          }
        }

        async function playCurrentSpot() {
          if (!currentSpot) return;

          try {
            updateStatus("Loading", "bg-amber-400/20 text-amber-100");
            const hasAnalyser = setupAudioAnalyser();

            if (hasAnalyser && audioContext?.state === "suspended") {
              await audioContext.resume();
            }

            await audio.play();
            updateStatus("Live", "bg-emerald-400/20 text-emerald-100");
            toggleButton.textContent = "⏸ Stop";
            setPlayingMarker(currentSpot);
            startVisualizer();
            message.textContent = `${currentSpot.city} の ${currentSpot.station} を再生中です。`;
          } catch (error) {
            // ブラウザの自動再生制限や、放送局側の一時停止に備えてメッセージを出します。
            updateStatus("Blocked", "bg-rose-500/20 text-rose-100");
            toggleButton.textContent = "▶ Play";
            setPlayingMarker(null);
            stopVisualizer();
            message.textContent =
              "再生できませんでした。もう一度Playを押すか、別の都市を試してください。";
            console.error("Audio playback failed:", error);
          }
        }

        function stopAudio() {
          audio.pause();
          setPlayingMarker(null);
          stopVisualizer();
          updateStatus("Paused", "bg-slate-800 text-slate-300");
          toggleButton.textContent = "▶ Play";
          message.textContent = currentSpot
            ? `${currentSpot.city} の音源を一時停止しました。`
            : "地図上のピンをクリックしてください。";
        }

        toggleButton.addEventListener("click", () => {
          if (audio.paused) {
            playCurrentSpot();
          } else {
            stopAudio();
          }
        });

        volumeSlider.addEventListener("input", (event) => {
          const volume = Number(event.target.value) / 100;
          audio.volume = volume;
          volumeValue.textContent = `${event.target.value}%`;
        });

        randomButton.addEventListener("click", () => {
          // 連続で同じ都市を選びにくくして、旅をしている感覚を出します。
          let randomIndex = Math.floor(Math.random() * audioSpots.length);
          if (audioSpots.length > 1) {
            while (randomIndex === lastRandomIndex) {
              randomIndex = Math.floor(Math.random() * audioSpots.length);
            }
          }

          lastRandomIndex = randomIndex;
          selectSpot(audioSpots[randomIndex], true);
        });

        audio.addEventListener("playing", () => {
          updateStatus("Live", "bg-emerald-400/20 text-emerald-100");
          toggleButton.textContent = "⏸ Stop";
          setPlayingMarker(currentSpot);
          startVisualizer();
        });

        audio.addEventListener("waiting", () => {
          updateStatus("Buffering", "bg-amber-400/20 text-amber-100");
        });

        audio.addEventListener("pause", () => {
          setPlayingMarker(null);
          stopVisualizer();

          if (currentSpot) {
            updateStatus("Paused", "bg-slate-800 text-slate-300");
          }
        });

        audio.addEventListener("error", () => {
          updateStatus("Error", "bg-rose-500/20 text-rose-100");
          setPlayingMarker(null);
          stopVisualizer();
          message.textContent = "音声ストリームでエラーが発生しました。別の都市も試してみてください。";
          toggleButton.textContent = "▶ Play";
        });

        setTimeout(() => {
          map.invalidateSize();
        }, 500);
      });
    </script>
  </body>
</html>
