<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoMap | 世界の音を旅する地図</title>

    <!-- GitHub Pagesでそのまま動かせるように、CSS/JSはCDNから読み込みます。 -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!--
      Leaflet CSS
      integrity属性の値がCDN側の実体とズレるとブラウザにブロックされるため、
      今回は integrity / crossorigin を外しています。
    -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!--
      Leaflet JS
      CSS側と同じく、CDN読み込み時のintegrity不一致を避けるため、
      integrity / crossorigin を外しています。
    -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      defer
    ></script>

    <style>
      html,
      body {
        height: 100%;
      }

      #map {
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 0;
      }

      .control-panel {
        z-index: 10;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #020617;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      /*
        Tailwindやブラウザ側のCSSリセットで img { max-width: 100%; } が効くと、
        Leafletの地図タイル画像のサイズ計算が崩れることがあります。
        タイル歯抜け・ズレ対策として、Leaflet内の画像は本来サイズで表示させます。
      */
      .leaflet-container img {
        max-width: none;
      }

      .leaflet-tile {
        max-width: none !important;
      }

      /* Leafletのポップアップもアプリ全体のダークな雰囲気に合わせます。 */
      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        background: rgba(15, 23, 42, 0.95);
        color: #e2e8f0;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      }

      .leaflet-popup-content {
        margin: 14px 16px;
      }

      /* ピンを少し光らせ、夜の地図上でも見つけやすくします。 */
      .pulse-pin {
        align-items: center;
        background: linear-gradient(135deg, #22d3ee, #a78bfa);
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 9999px;
        box-shadow: 0 0 0 8px rgba(34, 211, 238, 0.12), 0 12px 30px rgba(14, 165, 233, 0.35);
        color: #0f172a;
        display: flex;
        font-size: 15px;
        height: 34px;
        justify-content: center;
        width: 34px;
      }

      input[type="range"] {
        accent-color: #22d3ee;
      }

      .now-playing-card {
        overflow: hidden;
        position: relative;
      }

      .now-playing-card::after {
        background: radial-gradient(circle at center, rgba(0, 229, 255, 0.22), transparent 68%);
        content: "";
        filter: blur(10px);
        inset: auto 0 -38px auto;
        opacity: 0.7;
        position: absolute;
        right: -28px;
        width: 180px;
        height: 150px;
      }

      .now-playing-copy {
        min-width: 0;
        position: relative;
        z-index: 1;
      }

      .audio-visualizer {
        align-items: center;
        display: flex;
        flex: 0 0 auto;
        gap: 5px;
        height: 72px;
        justify-content: center;
        min-width: 82px;
        position: relative;
        z-index: 1;
      }

      .visualizer-bar {
        background: linear-gradient(180deg, #ecfeff 0%, #00e5ff 48%, #0891b2 100%);
        border-radius: 9999px;
        box-shadow: 0 0 10px rgba(0, 229, 255, 0.72), 0 0 24px rgba(0, 229, 255, 0.32);
        height: 18px;
        opacity: 0.86;
        transform-origin: center;
        transition: height 90ms ease-out, opacity 180ms ease-out;
        width: 5px;
      }

      .audio-visualizer:not(.is-live) .visualizer-bar {
        opacity: 0.45;
      }

      @media (max-width: 420px) {
        .audio-visualizer {
          gap: 4px;
          min-width: 66px;
        }

        .visualizer-bar {
          width: 4px;
        }
      }
    </style>
  </head>
  <body>
    <main class="relative h-full w-full">
      <div id="map" aria-label="世界中のライブ音源を選べる地図"></div>

      <!-- 半透明のコントロールパネル。スマホでは下部、PCでは左上に固定します。 -->
      <section
        class="control-panel absolute inset-x-4 bottom-4 rounded-3xl border border-white/15 bg-slate-950/75 p-5 text-white shadow-2xl shadow-cyan-950/40 backdrop-blur-xl md:bottom-auto md:left-6 md:right-auto md:top-6 md:w-[380px]"
        aria-label="再生コントロール"
      >
        <div class="mb-5 flex items-start justify-between gap-4">
          <div>
            <p class="text-xs font-semibold uppercase tracking-[0.35em] text-cyan-300">EchoMap</p>
            <h1 class="mt-1 text-2xl font-bold tracking-tight">世界の音へジャンプ</h1>
          </div>
          <span id="statusBadge" class="rounded-full bg-slate-800 px-3 py-1 text-xs font-semibold text-slate-300">
            Standby
          </span>
        </div>

        <div class="now-playing-card rounded-2xl border border-white/10 bg-white/10 p-4">
          <div class="flex items-center justify-between gap-4">
            <div class="now-playing-copy">
              <p class="text-sm text-slate-300">現在再生中</p>
              <h2 id="cityName" class="mt-1 text-3xl font-black leading-tight">都市を選択</h2>
              <p id="stationName" class="mt-1 text-sm font-medium text-cyan-200">
                地図上のピンをクリックしてください
              </p>
            </div>
            <div
              id="audioVisualizer"
              class="audio-visualizer"
              aria-label="再生中の音量に反応するオーディオ・ビジュアライザー"
            >
              <span class="visualizer-bar"></span>
              <span class="visualizer-bar"></span>
              <span class="visualizer-bar"></span>
              <span class="visualizer-bar"></span>
              <span class="visualizer-bar"></span>
              <span class="visualizer-bar"></span>
              <span class="visualizer-bar"></span>
            </div>
          </div>
        </div>

        <div class="mt-5 grid grid-cols-2 gap-3">
          <button
            id="toggleButton"
            type="button"
            class="rounded-2xl bg-cyan-400 px-4 py-3 font-bold text-slate-950 transition hover:bg-cyan-300 focus:outline-none focus:ring-4 focus:ring-cyan-300/35 disabled:cursor-not-allowed disabled:opacity-50"
            disabled
          >
            ▶ Play
          </button>
          <button
            id="randomButton"
            type="button"
            class="rounded-2xl border border-white/15 bg-white/10 px-4 py-3 font-bold transition hover:bg-white/20 focus:outline-none focus:ring-4 focus:ring-white/20"
          >
            Random Jump
          </button>
        </div>

        <label class="mt-5 block text-sm font-semibold text-slate-200" for="volumeSlider">
          音量 <span id="volumeValue" class="text-cyan-200">70%</span>
        </label>
        <input id="volumeSlider" class="mt-2 w-full" type="range" min="0" max="100" value="70" />

        <p id="message" class="mt-4 min-h-5 text-xs leading-relaxed text-slate-300">
          ライブ配信は各放送局が提供するため、地域や時間帯によって再生できない場合があります。
        </p>
      </section>
    </main>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        // Leaflet本体がCDNから読み込めなかった場合の保険です。
        if (typeof L === "undefined") {
          console.error("Leafletが読み込めていません。CDNの読み込み状況を確認してください。");
          return;
        }

        // 都市データはここにまとめています。新しい音源を足すときは、この配列に1件追加するだけです。
        const audioSpots = [
          {
            city: "東京",
            country: "Japan",
            station: "J1 HITS",
            coordinates: [35.6762, 139.6503],
            streamUrl: "https://jenny.torontocast.com:2000/stream/J1HITS",
            sourceUrl: "https://www.j1fm.tokyo/j1/developers/",
          },
          {
            city: "ニューヨーク",
            country: "United States",
            station: "WNYC FM 93.9",
            coordinates: [40.7128, -74.006],
            streamUrl: "https://fm939.wnyc.org/wnycfm",
            sourceUrl: "https://www.wnyc.org/radio/",
          },
          {
            city: "ロンドン",
            country: "United Kingdom",
            station: "NTS Radio 1",
            coordinates: [51.5074, -0.1278],
            streamUrl: "https://stream-relay-geo.ntslive.net/stream",
            sourceUrl: "https://www.nts.live/radio",
          },
          {
            city: "パリ",
            country: "France",
            station: "FIP Radio",
            coordinates: [48.8566, 2.3522],
            streamUrl: "https://icecast.radiofrance.fr/fip-hifi.aac",
            sourceUrl: "https://www.radiofrance.fr/fip",
          },
          {
            city: "リオデジャネイロ",
            country: "Brazil",
            station: "JB FM Rio",
            coordinates: [-22.9068, -43.1729],
            streamUrl: "https://playerservices.streamtheworld.com/api/livestream-redirect/JBFMAAC.aac",
            sourceUrl: "https://www.jbfm.com.br/",
          },
          {
            city: "サンフランシスコ",
            country: "United States",
            station: "SomaFM Live",
            coordinates: [37.7749, -122.4194],
            streamUrl: "https://ice5.somafm.com/live-128-mp3",
            sourceUrl: "https://somafm.com/live/directstreamlinks.html",
          },
        ];

        const mapElement = document.querySelector("#map");
        const worldBounds = L.latLngBounds([
          [-85.05112878, -180],
          [85.05112878, 180],
        ]);

        function calculateSingleWorldZoom() {
          // Webメルカトル地図は「256px × 2^zoom」の正方形です。画面より世界地図が
          // 小さいzoomを許すと、Leafletが右隣に世界のコピーを描き、つなぎ目が不自然に
          // 見えます。画面を覆える最小の整数zoomを下限にして、世界のコピーを出しません。
          const width = mapElement?.clientWidth || window.innerWidth;
          const height = mapElement?.clientHeight || window.innerHeight;
          const longestSide = Math.max(width, height);
          return Math.max(2, Math.ceil(Math.log2(longestSide / 256)));
        }

        const initialZoom = calculateSingleWorldZoom();
        const map = L.map("map", {
          zoomControl: false,
          maxBounds: worldBounds,
          maxBoundsViscosity: 1,
          minZoom: initialZoom,
          zoomSnap: 1,
          zoomDelta: 1,
        }).setView([25, 10], initialZoom);

        L.control.zoom({ position: "bottomright" }).addTo(map);

        // CartoDB.DarkMatterタイルで、画面いっぱいのダークモード地図を表示します。
        const baseTiles = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
          bounds: worldBounds,
          keepBuffer: 6,
          maxZoom: 19,
          noWrap: true,
          updateWhenIdle: false,
          updateWhenZooming: false,
        }).addTo(map);

        const tileRetryCounts = new WeakMap();
        baseTiles.on("tileerror", (event) => {
          const retryCount = tileRetryCounts.get(event.tile) || 0;
          if (retryCount >= 2) return;

          tileRetryCounts.set(event.tile, retryCount + 1);
          window.setTimeout(() => {
            const retryUrl = new URL(event.tile.src);
            retryUrl.searchParams.set("retry", `${Date.now()}-${retryCount + 1}`);
            event.tile.src = retryUrl.toString();
          }, 350 * (retryCount + 1));
        });

        function applyResponsiveZoomFloor() {
          const nextMinZoom = calculateSingleWorldZoom();
          map.setMinZoom(nextMinZoom);

          if (map.getZoom() < nextMinZoom) {
            map.setZoom(nextMinZoom, { animate: false });
          }
        }

        function refreshMapLayout() {
          // 初期表示時や画面回転時にブラウザがまだレイアウト計算中だと、Leafletが地図
          // コンテナを小さく見積もって一部のタイルだけを読み込むことがあります。実サイズ
          // を再計算し、世界地図1枚で画面を覆えるzoom下限も更新して歯抜けと継ぎ目を防ぎます。
          applyResponsiveZoomFloor();
          map.invalidateSize({ pan: false });
          map.panInsideBounds(worldBounds, { animate: false });
        }

        requestAnimationFrame(refreshMapLayout);
        window.addEventListener("load", refreshMapLayout);
        window.addEventListener("resize", refreshMapLayout);
        setTimeout(refreshMapLayout, 250);
        setTimeout(refreshMapLayout, 750);

        const audio = new Audio();
        audio.preload = "none";
        audio.volume = 0.7;

        const cityName = document.querySelector("#cityName");
        const stationName = document.querySelector("#stationName");
        const statusBadge = document.querySelector("#statusBadge");
        const toggleButton = document.querySelector("#toggleButton");
        const randomButton = document.querySelector("#randomButton");
        const volumeSlider = document.querySelector("#volumeSlider");
        const volumeValue = document.querySelector("#volumeValue");
        const message = document.querySelector("#message");
        const audioVisualizer = document.querySelector("#audioVisualizer");
        const visualizerBars = Array.from(document.querySelectorAll(".visualizer-bar"));

        let currentSpot = null;
        let lastRandomIndex = -1;
        let audioContext = null;
        let analyser = null;
        let audioSourceNode = null;
        let frequencyData = null;
        let visualizerAnimationId = null;
        const displayedBarHeights = visualizerBars.map(() => 18);

        const pinIcon = L.divIcon({
          className: "",
          html: '<div class="pulse-pin">◉</div>',
          iconSize: [34, 34],
          iconAnchor: [17, 17],
          popupAnchor: [0, -18],
        });

        // ピンをクリックしたらselectSpotを呼び、前の音を止めて新しい音を再生します。
        audioSpots.forEach((spot) => {
          L.marker(spot.coordinates, { icon: pinIcon })
            .addTo(map)
            .bindPopup(
              `<strong>${spot.city}</strong><br><span>${spot.station}</span><br><small>${spot.country}</small><br><a class="text-cyan-200 underline" href="${spot.sourceUrl}" target="_blank" rel="noopener noreferrer">配信元を見る</a>`,
            )
            .on("click", () => selectSpot(spot, true));
        });

        function updateStatus(text, styleClass) {
          statusBadge.textContent = text;
          statusBadge.className = `rounded-full px-3 py-1 text-xs font-semibold ${styleClass}`;
        }

        function updateNowPlaying(spot) {
          cityName.textContent = spot.city;
          stationName.textContent = `${spot.station} / ${spot.country}`;
          toggleButton.disabled = false;
        }

        async function selectSpot(spot, shouldAutoPlay) {
          currentSpot = spot;
          updateNowPlaying(spot);
          message.textContent = `${spot.city} のライブ音源に接続しています。`;

          // srcを差し替える前に必ず停止し、同時に2つの音が鳴らないようにします。
          audio.pause();
          audio.currentTime = 0;
          audio.src = spot.streamUrl;
          audio.load();

          map.flyTo(spot.coordinates, 7, { duration: 1.35 });
          updateStatus("Ready", "bg-cyan-400/20 text-cyan-100");
          toggleButton.textContent = "▶ Play";

          if (shouldAutoPlay) {
            await playCurrentSpot();
          }
        }

        async function playCurrentSpot() {
          if (!currentSpot) return;

          try {
            updateStatus("Loading", "bg-amber-400/20 text-amber-100");
            await ensureAudioAnalyser();
            await audio.play();
            startVisualizer();
            updateStatus("Live", "bg-emerald-400/20 text-emerald-100");
            toggleButton.textContent = "⏸ Stop";
            message.textContent = `${currentSpot.city} の ${currentSpot.station} を再生中です。`;
          } catch (error) {
            // ブラウザの自動再生制限や、放送局側の一時停止に備えてメッセージを出します。
            updateStatus("Blocked", "bg-rose-500/20 text-rose-100");
            toggleButton.textContent = "▶ Play";
            message.textContent =
              "再生できませんでした。もう一度Playを押すか、別の都市を試してください。";
            console.error("Audio playback failed:", error);
          }
        }

        function stopAudio() {
          audio.pause();
          stopVisualizer();
          updateStatus("Paused", "bg-slate-800 text-slate-300");
          toggleButton.textContent = "▶ Play";
          message.textContent = currentSpot
            ? `${currentSpot.city} の音源を一時停止しました。`
            : "地図上のピンをクリックしてください。";
        }

        toggleButton.addEventListener("click", () => {
          if (audio.paused) {
            playCurrentSpot();
          } else {
            stopAudio();
          }
        });

        volumeSlider.addEventListener("input", (event) => {
          const volume = Number(event.target.value) / 100;
          audio.volume = volume;
          volumeValue.textContent = `${event.target.value}%`;
        });

        async function ensureAudioAnalyser() {
          if (analyser) {
            if (audioContext?.state === "suspended") {
              await audioContext.resume();
            }
            return;
          }

          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) {
            startVisualizer(true);
            return;
          }

          audioContext = new AudioContextClass();
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 128;
          analyser.smoothingTimeConstant = 0.82;
          frequencyData = new Uint8Array(analyser.frequencyBinCount);

          if (typeof audio.captureStream === "function") {
            audioSourceNode = audioContext.createMediaStreamSource(audio.captureStream());
            audioSourceNode.connect(analyser);
          } else {
            // captureStream非対応ブラウザではMediaElementSource経由で解析し、音も同じ経路で出します。
            audioSourceNode = audioContext.createMediaElementSource(audio);
            audioSourceNode.connect(analyser);
            analyser.connect(audioContext.destination);
          }

          if (audioContext.state === "suspended") {
            await audioContext.resume();
          }
        }

        function setVisualizerBars(heights, isLive) {
          audioVisualizer.classList.toggle("is-live", isLive);
          heights.forEach((height, index) => {
            const smoothedHeight = displayedBarHeights[index] + (height - displayedBarHeights[index]) * 0.24;
            displayedBarHeights[index] = smoothedHeight;
            visualizerBars[index].style.height = `${smoothedHeight.toFixed(1)}px`;
          });
        }

        function startVisualizer(useFallback = false) {
          cancelAnimationFrame(visualizerAnimationId);

          const animate = () => {
            if (audio.paused || audio.ended) {
              stopVisualizer();
              return;
            }

            if (analyser && frequencyData && !useFallback) {
              analyser.getByteFrequencyData(frequencyData);
            }

            const nextHeights = visualizerBars.map((_, index) => {
              if (analyser && frequencyData && !useFallback) {
                const bandStart = Math.floor((frequencyData.length / visualizerBars.length) * index);
                const bandEnd = Math.max(bandStart + 1, Math.floor((frequencyData.length / visualizerBars.length) * (index + 1)));
                let total = 0;
                for (let i = bandStart; i < bandEnd; i += 1) {
                  total += frequencyData[i];
                }
                const bandLevel = total / (bandEnd - bandStart) / 255;
                return 12 + Math.pow(bandLevel, 0.72) * 52;
              }

              const wave = Math.sin(Date.now() / 180 + index * 0.9) * 0.5 + 0.5;
              return 14 + wave * 34;
            });

            setVisualizerBars(nextHeights, true);
            visualizerAnimationId = requestAnimationFrame(animate);
          };

          animate();
        }

        function stopVisualizer() {
          cancelAnimationFrame(visualizerAnimationId);
          visualizerAnimationId = null;
          setVisualizerBars(visualizerBars.map((_, index) => 14 + (index % 3) * 3), false);
        }

        randomButton.addEventListener("click", () => {
          // 連続で同じ都市を選びにくくして、旅をしている感覚を出します。
          let randomIndex = Math.floor(Math.random() * audioSpots.length);
          if (audioSpots.length > 1) {
            while (randomIndex === lastRandomIndex) {
              randomIndex = Math.floor(Math.random() * audioSpots.length);
            }
          }

          lastRandomIndex = randomIndex;
          selectSpot(audioSpots[randomIndex], true);
        });

        audio.addEventListener("playing", () => {
          updateStatus("Live", "bg-emerald-400/20 text-emerald-100");
          toggleButton.textContent = "⏸ Stop";
          startVisualizer();
        });

        audio.addEventListener("waiting", () => {
          updateStatus("Buffering", "bg-amber-400/20 text-amber-100");
        });

        audio.addEventListener("pause", () => {
          stopVisualizer();
          if (currentSpot) {
            updateStatus("Paused", "bg-slate-800 text-slate-300");
          }
        });

        audio.addEventListener("error", () => {
          stopVisualizer();
          updateStatus("Error", "bg-rose-500/20 text-rose-100");
          message.textContent = "音声ストリームでエラーが発生しました。別の都市も試してみてください。";
          toggleButton.textContent = "▶ Play";
        });

        setTimeout(() => {
          map.invalidateSize();
        }, 500);
      });
    </script>
  </body>
</html>
