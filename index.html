<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoMap | 世界の音を旅する地図</title>

    <!-- GitHub Pagesでそのまま動かせるように、CSS/JSはCDNから読み込みます。 -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #020617;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .app-shell {
        display: grid;
        grid-template-columns: minmax(320px, 625px) minmax(0, 1fr);
        height: 100%;
        width: 100%;
      }

      .control-column {
        align-items: start;
        border-right: 2px solid rgba(248, 113, 113, 0.45);
        display: flex;
        padding: 22px 24px;
        position: relative;
        z-index: 10;
      }

      .control-column::after {
        background: linear-gradient(180deg, #ef4444, #f97316 55%, #ef4444);
        border-radius: 9999px;
        box-shadow: 0 0 18px rgba(239, 68, 68, 0.45);
        content: "";
        position: absolute;
        right: -5px;
        top: 20px;
        bottom: 28px;
        width: 5px;
      }

      .control-panel {
        width: min(100%, 572px);
      }

      .map-stage {
        background:
          radial-gradient(circle at 50% 50%, rgba(8, 47, 73, 0.22), transparent 42%),
          linear-gradient(135deg, #020617 0%, #030712 52%, #08111f 100%);
        min-width: 0;
        overflow: hidden;
        position: relative;
      }

      .map-stage::before {
        background-image:
          linear-gradient(rgba(34, 211, 238, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34, 211, 238, 0.045) 1px, transparent 1px);
        background-size: 68px 68px;
        content: "";
        inset: 0;
        mask-image: radial-gradient(circle at 50% 50%, #000 0 62%, transparent 82%);
        opacity: 0.65;
        position: absolute;
      }

      .world-map-panel {
        aspect-ratio: 2 / 1;
        left: 50%;
        max-height: min(82vh, 720px);
        max-width: min(92%, 1280px);
        min-width: min(92%, 680px);
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 88%;
      }

      .world-map {
        background:
          radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.12), transparent 62%),
          linear-gradient(180deg, rgba(15, 23, 42, 0.82), rgba(2, 6, 23, 0.92));
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 32px;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.04),
          0 30px 90px rgba(8, 47, 73, 0.35);
        height: 100%;
        overflow: hidden;
        position: relative;
        width: 100%;
      }

      .world-map::before {
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
        background-size: 12.5% 25%;
        content: "";
        inset: 0;
        position: absolute;
      }

      .world-map svg {
        display: block;
        filter: drop-shadow(0 16px 22px rgba(0, 0, 0, 0.28));
        height: 100%;
        position: absolute;
        width: 100%;
      }

      .land {
        fill: rgba(30, 41, 59, 0.96);
        stroke: rgba(103, 232, 249, 0.16);
        stroke-width: 0.8;
      }

      .country-line {
        fill: none;
        stroke: rgba(148, 163, 184, 0.12);
        stroke-width: 0.45;
      }

      .map-pin {
        align-items: center;
        background: transparent;
        border: 0;
        color: #0f172a;
        cursor: pointer;
        display: flex;
        height: 46px;
        justify-content: center;
        padding: 0;
        position: absolute;
        transform: translate(-50%, -100%);
        transition: transform 180ms ease, filter 180ms ease;
        width: 46px;
        z-index: 3;
      }

      .map-pin::before {
        background: linear-gradient(135deg, #22d3ee, #a78bfa);
        border: 2px solid rgba(255, 255, 255, 0.92);
        border-radius: 9999px 9999px 9999px 0;
        box-shadow: 0 0 0 8px rgba(34, 211, 238, 0.12), 0 14px 28px rgba(14, 165, 233, 0.32);
        content: "";
        height: 30px;
        position: absolute;
        transform: rotate(-45deg);
        width: 30px;
      }

      .map-pin::after {
        background: #020617;
        border-radius: 9999px;
        content: "";
        height: 9px;
        position: absolute;
        top: 10px;
        width: 9px;
      }

      .map-pin:hover,
      .map-pin:focus-visible,
      .map-pin.is-active {
        filter: brightness(1.18);
        transform: translate(-50%, -100%) scale(1.12);
      }

      .map-pin.is-active::before {
        animation: activePulse 1.45s ease-out infinite;
        background: linear-gradient(135deg, #67e8f9, #f0abfc);
        box-shadow: 0 0 0 12px rgba(34, 211, 238, 0.14), 0 18px 34px rgba(168, 85, 247, 0.38);
      }

      .map-tooltip {
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        bottom: calc(100% + 8px);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.32);
        color: #e2e8f0;
        left: 50%;
        min-width: 170px;
        opacity: 0;
        padding: 10px 12px;
        pointer-events: none;
        position: absolute;
        text-align: left;
        transform: translateX(-50%) translateY(6px);
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .map-pin:hover .map-tooltip,
      .map-pin:focus-visible .map-tooltip,
      .map-pin.is-active .map-tooltip {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .spot-link {
        color: #a5f3fc;
        text-decoration: underline;
      }

      .map-caption {
        bottom: 24px;
        color: rgba(226, 232, 240, 0.72);
        font-size: 0.85rem;
        left: 50%;
        position: absolute;
        text-align: center;
        transform: translateX(-50%);
        width: min(92%, 820px);
      }

      input[type="range"] {
        accent-color: #22d3ee;
      }

      @keyframes activePulse {
        0% {
          box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.28), 0 18px 34px rgba(168, 85, 247, 0.38);
        }
        70% {
          box-shadow: 0 0 0 16px rgba(34, 211, 238, 0), 0 18px 34px rgba(168, 85, 247, 0.38);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(34, 211, 238, 0), 0 18px 34px rgba(168, 85, 247, 0.38);
        }
      }

      @media (max-width: 900px) {
        body {
          overflow: auto;
        }

        .app-shell {
          display: flex;
          flex-direction: column;
          min-height: 100%;
        }

        .control-column {
          border-bottom: 2px solid rgba(248, 113, 113, 0.45);
          border-right: 0;
          padding: 18px 16px;
        }

        .control-column::after {
          bottom: -5px;
          height: 5px;
          left: 16px;
          right: 16px;
          top: auto;
          width: auto;
        }

        .control-panel {
          width: 100%;
        }

        .map-stage {
          flex: 1 0 58vh;
          min-height: 520px;
        }

        .world-map-panel {
          min-width: 0;
          width: 94%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <!-- 赤い境界線の左側は操作だけにし、地図は右側の領域へ固定表示します。 -->
      <aside class="control-column" aria-label="再生コントロール">
        <section class="control-panel rounded-3xl border border-white/15 bg-slate-950/75 p-5 text-white shadow-2xl shadow-cyan-950/40 backdrop-blur-xl">
          <div class="mb-5 flex items-start justify-between gap-4">
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.35em] text-cyan-300">EchoMap</p>
              <h1 class="mt-1 text-2xl font-bold tracking-tight">世界の音へジャンプ</h1>
            </div>
            <span id="statusBadge" class="rounded-full bg-slate-800 px-3 py-1 text-xs font-semibold text-slate-300">
              Standby
            </span>
          </div>

          <div class="rounded-2xl border border-white/10 bg-white/10 p-4">
            <p class="text-sm text-slate-300">現在再生中</p>
            <h2 id="cityName" class="mt-1 text-3xl font-black leading-tight">都市を選択</h2>
            <p id="stationName" class="mt-1 text-sm font-medium text-cyan-200">
              右側の世界地図にあるピンをクリックしてください
            </p>
          </div>

          <div class="mt-5 grid grid-cols-2 gap-3">
            <button
              id="toggleButton"
              type="button"
              class="rounded-2xl bg-cyan-400 px-4 py-3 font-bold text-slate-950 transition hover:bg-cyan-300 focus:outline-none focus:ring-4 focus:ring-cyan-300/35 disabled:cursor-not-allowed disabled:opacity-50"
              disabled
            >
              ▶ Play
            </button>
            <button
              id="randomButton"
              type="button"
              class="rounded-2xl border border-white/15 bg-white/10 px-4 py-3 font-bold transition hover:bg-white/20 focus:outline-none focus:ring-4 focus:ring-white/20"
            >
              Random Jump
            </button>
          </div>

          <label class="mt-5 block text-sm font-semibold text-slate-200" for="volumeSlider">
            音量 <span id="volumeValue" class="text-cyan-200">70%</span>
          </label>
          <input id="volumeSlider" class="mt-2 w-full" type="range" min="0" max="100" value="70" />

          <p id="message" class="mt-4 min-h-5 text-xs leading-relaxed text-slate-300">
            世界地図は固定画像として描画しています。タイル通信を使わないため、地図が歯抜けになりません。
          </p>
        </section>
      </aside>

      <section class="map-stage" aria-label="固定表示の世界地図">
        <div class="world-map-panel">
          <div id="worldMap" class="world-map" role="img" aria-label="ラジオ配信地点をピンで示した世界地図">
            <svg viewBox="0 0 1000 500" aria-hidden="true" focusable="false">
              <rect width="1000" height="500" fill="rgba(2, 6, 23, 0.28)" />
              <path class="land" d="M75 142 L119 105 L184 92 L236 114 L268 153 L252 205 L278 241 L247 280 L216 265 L196 313 L164 283 L143 232 L93 210 Z" />
              <path class="land" d="M245 304 L285 342 L296 401 L271 470 L235 445 L218 389 L226 340 Z" />
              <path class="land" d="M466 116 L548 88 L644 116 L709 160 L742 218 L707 257 L623 244 L576 276 L505 258 L462 207 Z" />
              <path class="land" d="M494 239 L559 250 L610 307 L590 398 L552 459 L509 419 L474 339 Z" />
              <path class="land" d="M677 220 L755 194 L835 210 L888 266 L858 326 L790 334 L740 291 Z" />
              <path class="land" d="M786 342 L848 352 L892 398 L860 438 L803 430 L769 387 Z" />
              <path class="land" d="M343 128 L394 105 L455 132 L435 175 L377 181 Z" />
              <path class="land" d="M526 68 L600 55 L655 78 L609 102 L548 97 Z" />
              <path class="land" d="M401 198 L447 184 L476 219 L456 259 L408 251 L388 220 Z" />
              <path class="land" d="M180 84 L218 72 L244 89 L207 105 Z" />
              <path class="land" d="M894 76 L953 91 L974 124 L938 145 L887 128 Z" />
              <path class="country-line" d="M150 111 L176 164 L159 216 M215 116 L227 176 L252 205 M529 122 L515 192 L548 248 M619 118 L627 186 L676 222 M548 258 L531 332 L552 414 M764 215 L802 270 L790 334" />
            </svg>
            <div id="pinLayer" aria-label="ラジオ局のピン"></div>
          </div>
        </div>
        <p class="map-caption">タイル地図を読み込まず、固定の世界地図上に配信地点のピンだけを配置しています。</p>
      </section>
    </main>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        // 都市データはここにまとめています。新しい音源を足すときは、この配列に1件追加するだけです。
        const audioSpots = [
          {
            city: "東京",
            country: "Japan",
            station: "J1 HITS",
            coordinates: [35.6762, 139.6503],
            streamUrl: "https://jenny.torontocast.com:2000/stream/J1HITS",
            sourceUrl: "https://www.j1fm.tokyo/j1/developers/",
          },
          {
            city: "ニューヨーク",
            country: "United States",
            station: "WNYC FM 93.9",
            coordinates: [40.7128, -74.006],
            streamUrl: "https://fm939.wnyc.org/wnycfm",
            sourceUrl: "https://www.wnyc.org/radio/",
          },
          {
            city: "ロンドン",
            country: "United Kingdom",
            station: "NTS Radio 1",
            coordinates: [51.5074, -0.1278],
            streamUrl: "https://stream-relay-geo.ntslive.net/stream",
            sourceUrl: "https://www.nts.live/radio",
          },
          {
            city: "パリ",
            country: "France",
            station: "FIP Radio",
            coordinates: [48.8566, 2.3522],
            streamUrl: "https://icecast.radiofrance.fr/fip-hifi.aac",
            sourceUrl: "https://www.radiofrance.fr/fip",
          },
          {
            city: "リオデジャネイロ",
            country: "Brazil",
            station: "JB FM Rio",
            coordinates: [-22.9068, -43.1729],
            streamUrl: "https://playerservices.streamtheworld.com/api/livestream-redirect/JBFMAAC.aac",
            sourceUrl: "https://www.jbfm.com.br/",
          },
          {
            city: "サンフランシスコ",
            country: "United States",
            station: "SomaFM Live",
            coordinates: [37.7749, -122.4194],
            streamUrl: "https://ice5.somafm.com/live-128-mp3",
            sourceUrl: "https://somafm.com/live/directstreamlinks.html",
          },
        ];

        const audio = new Audio();
        audio.preload = "none";
        audio.volume = 0.7;

        const cityName = document.querySelector("#cityName");
        const stationName = document.querySelector("#stationName");
        const statusBadge = document.querySelector("#statusBadge");
        const toggleButton = document.querySelector("#toggleButton");
        const randomButton = document.querySelector("#randomButton");
        const volumeSlider = document.querySelector("#volumeSlider");
        const volumeValue = document.querySelector("#volumeValue");
        const message = document.querySelector("#message");
        const pinLayer = document.querySelector("#pinLayer");

        let currentSpot = null;
        let activePin = null;
        let lastRandomIndex = -1;

        function escapeHtml(text) {
          const replacementMap = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;",
          };

          return `${text}`.replace(/[&<>"']/g, (character) => replacementMap[character]);
        }

        function projectCoordinates([latitude, longitude]) {
          // 固定の世界地図は横方向を経度、縦方向を緯度に対応させる簡単な投影です。
          // タイルを取りに行かないので、通信失敗による欠けは発生しません。
          const x = ((longitude + 180) / 360) * 100;
          const y = ((90 - latitude) / 180) * 100;
          return { x, y };
        }

        function createPin(spot) {
          const { x, y } = projectCoordinates(spot.coordinates);
          const pin = document.createElement("button");
          pin.type = "button";
          pin.className = "map-pin";
          pin.style.left = `${x}%`;
          pin.style.top = `${y}%`;
          pin.setAttribute("aria-label", `${spot.city}の${spot.station}を再生`);
          pin.innerHTML = `
            <span class="map-tooltip" aria-hidden="true">
              <strong class="block text-sm">${escapeHtml(spot.city)}</strong>
              <span class="block text-xs text-cyan-100">${escapeHtml(spot.station)}</span>
              <span class="block text-[11px] text-slate-400">${escapeHtml(spot.country)}</span>
            </span>
          `;
          pin.addEventListener("click", () => selectSpot(spot, true, pin));
          pinLayer.appendChild(pin);
          return pin;
        }

        const spotPins = new Map(audioSpots.map((spot) => [spot, createPin(spot)]));

        function updateStatus(text, styleClass) {
          statusBadge.textContent = text;
          statusBadge.className = `rounded-full px-3 py-1 text-xs font-semibold ${styleClass}`;
        }

        function updateNowPlaying(spot) {
          cityName.textContent = spot.city;
          stationName.innerHTML = `${escapeHtml(spot.station)} / ${escapeHtml(spot.country)} ・ <a class="spot-link" href="${spot.sourceUrl}" target="_blank" rel="noopener noreferrer">配信元を見る</a>`;
          toggleButton.disabled = false;
        }

        function highlightPin(pin) {
          if (activePin) {
            activePin.classList.remove("is-active");
            activePin.setAttribute("aria-pressed", "false");
          }

          activePin = pin;
          activePin.classList.add("is-active");
          activePin.setAttribute("aria-pressed", "true");
        }

        async function selectSpot(spot, shouldAutoPlay, pin = spotPins.get(spot)) {
          currentSpot = spot;
          updateNowPlaying(spot);
          highlightPin(pin);
          message.textContent = `${spot.city} のライブ音源に接続しています。地図は固定したまま、再生地点のピンを光らせます。`;

          // srcを差し替える前に必ず停止し、同時に2つの音が鳴らないようにします。
          audio.pause();
          audio.currentTime = 0;
          audio.src = spot.streamUrl;
          audio.load();

          updateStatus("Ready", "bg-cyan-400/20 text-cyan-100");
          toggleButton.textContent = "▶ Play";

          if (shouldAutoPlay) {
            await playCurrentSpot();
          }
        }

        async function playCurrentSpot() {
          if (!currentSpot) return;

          try {
            updateStatus("Loading", "bg-amber-400/20 text-amber-100");
            await audio.play();
            updateStatus("Live", "bg-emerald-400/20 text-emerald-100");
            toggleButton.textContent = "⏸ Stop";
            message.textContent = `${currentSpot.city} の ${currentSpot.station} を再生中です。`;
          } catch (error) {
            // ブラウザの自動再生制限や、放送局側の一時停止に備えてメッセージを出します。
            updateStatus("Blocked", "bg-rose-500/20 text-rose-100");
            toggleButton.textContent = "▶ Play";
            message.textContent =
              "再生できませんでした。もう一度Playを押すか、別の都市を試してください。";
            console.error("Audio playback failed:", error);
          }
        }

        function stopAudio() {
          audio.pause();
          updateStatus("Paused", "bg-slate-800 text-slate-300");
          toggleButton.textContent = "▶ Play";
          message.textContent = currentSpot
            ? `${currentSpot.city} の音源を一時停止しました。`
            : "右側の世界地図にあるピンをクリックしてください。";
        }

        toggleButton.addEventListener("click", () => {
          if (audio.paused) {
            playCurrentSpot();
          } else {
            stopAudio();
          }
        });

        volumeSlider.addEventListener("input", (event) => {
          const volume = Number(event.target.value) / 100;
          audio.volume = volume;
          volumeValue.textContent = `${event.target.value}%`;
        });

        randomButton.addEventListener("click", () => {
          // 連続で同じ都市を選びにくくして、旅をしている感覚を出します。
          let randomIndex = Math.floor(Math.random() * audioSpots.length);
          if (audioSpots.length > 1) {
            while (randomIndex === lastRandomIndex) {
              randomIndex = Math.floor(Math.random() * audioSpots.length);
            }
          }

          lastRandomIndex = randomIndex;
          const spot = audioSpots[randomIndex];
          selectSpot(spot, true, spotPins.get(spot));
        });

        audio.addEventListener("playing", () => {
          updateStatus("Live", "bg-emerald-400/20 text-emerald-100");
          toggleButton.textContent = "⏸ Stop";
        });

        audio.addEventListener("waiting", () => {
          updateStatus("Buffering", "bg-amber-400/20 text-amber-100");
        });

        audio.addEventListener("pause", () => {
          if (currentSpot) {
            updateStatus("Paused", "bg-slate-800 text-slate-300");
          }
        });

        audio.addEventListener("error", () => {
          updateStatus("Error", "bg-rose-500/20 text-rose-100");
          message.textContent = "音声ストリームでエラーが発生しました。別の都市も試してみてください。";
          toggleButton.textContent = "▶ Play";
        });
      });
    </script>
  </body>
</html>
